name: Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional semantic version override (e.g. 1.2.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Compute monotonic version
        id: version
        shell: bash
        run: |
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          OVERRIDE="${{ inputs.version_override }}"

          if [ -n "$OVERRIDE" ]; then
            VERSION_NAME="${OVERRIDE#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | cut -d'+' -f1)
            MAJOR_MINOR=$(echo "$PUBSPEC_VERSION" | awk -F'.' '{print $1 "." $2}')
            VERSION_NAME="${MAJOR_MINOR}.${BUILD_NUMBER}"
          fi

          TAG_NAME="v${VERSION_NAME}"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Configure Android release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing Android signing secrets (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${KEYSTORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.version_name }}" \
            --build-number="${{ steps.version.outputs.build_number }}"

      - name: Package versioned release assets
        shell: bash
        run: |
          mkdir -p dist
          APK_NAME="nihongo-tap-v${{ steps.version.outputs.version_name }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${APK_NAME}"

          (cd dist && sha256sum "${APK_NAME}" > SHA256SUMS.txt)

          cat <<EOF > dist/version.json
          {
            "versionName": "${{ steps.version.outputs.version_name }}",
            "versionCode": ${{ steps.version.outputs.build_number }},
            "apk": "${APK_NAME}",
            "tag": "${{ steps.version.outputs.tag_name }}"
          }
          EOF

      - name: Clean up signing material
        if: always()
        shell: bash
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nihongo-tap-v${{ steps.version.outputs.version_name }}
          path: dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          TITLE="Nihongo Tap v${{ steps.version.outputs.version_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TITLE" \
              --generate-notes
          fi
